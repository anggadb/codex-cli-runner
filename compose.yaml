services:
  codex-runner:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    environment:
      PROJECTS_JSON: '${PROJECTS_JSON:?Set PROJECTS_JSON in .env}'
      N8N_APPROVAL_WEBHOOK_URL: '${N8N_APPROVAL_WEBHOOK_URL:-}'
      RUNNER_PUBLIC_URL: '${RUNNER_PUBLIC_URL:-}'
      APPROVAL_SECRET: '${APPROVAL_SECRET:-}'
      APPROVAL_TIMEOUT_MS: '${APPROVAL_TIMEOUT_MS:-900000}'
      TASK_TIMEOUT_MS: '${TASK_TIMEOUT_MS:-2700000}'
    volumes:
      - ${CODEX_HOME_PATH:-./.codex-data}:/home/node/.codex
      - ${PROJECT_PATH:-./workspace}:/workspaces/my-project
      - ./logs:/app/logs
